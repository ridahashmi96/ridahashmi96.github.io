name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AA10CF: ${{ secrets.AA10CF }}
          B6A99B: ${{ secrets.B6A99B }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AA10CF', '')
          meta_b = os.environ.get('B6A99B', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 8507eb4fc2247363e3c76b85dea1 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 001eb24aca98e39da2df -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
